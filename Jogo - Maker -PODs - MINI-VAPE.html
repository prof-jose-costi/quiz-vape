<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Você consegue gabaritar este Quiz sobre Vapes e PODs? Desafie-se com 20 perguntas multidisciplinares abordando saúde, meio ambiente e sociedade!">
    <title>Quiz Educativo: Conscientização sobre PODs e Vapes</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1a24;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #252636;
            width: 100%;
            max-width: 700px;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            position: relative;
        }

        /* Form de Cadastro */
        .registration-screen {
            display: block;
        }

        .registration-screen h2 {
            color: #70a1ff;
            margin-bottom: 15px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #a4b0be;
            font-size: 0.95rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #3b3d54;
            background: #1a1a24;
            color: #fff;
            font-size: 1rem;
        }

        .start-btn {
            background: #2ed573;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            font-size: 1.1rem;
            margin-top: 10px;
        }

        .start-btn:hover {
            background: #26af5f;
        }

        /* Estilos do Quiz */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #3b3d54;
            padding-bottom: 15px;
        }

        .hearts-container { font-size: 1.5rem; color: #ff4757; }
        .score-info { font-size: 1.1rem; color: #a4b0be; }

        .question-category {
            color: #2ed573;
            font-size: 0.9rem;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .question-text {
            font-size: 1.2rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: #33354a;
            color: #fff;
            border: 2px solid transparent;
            padding: 14px 18px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            background: #40435c;
            border-color: #70a1ff;
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            font-size: 1rem;
            line-height: 1.4;
        }

        .feedback.correct { background: rgba(46, 213, 115, 0.2); border: 1px solid #2ed573; color: #2ed573; }
        .feedback.incorrect { background: rgba(255, 71, 87, 0.2); border: 1px solid #ff4757; color: #ff4757; }

        .next-btn {
            margin-top: 15px;
            background: #70a1ff;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            display: none;
            width: 100%;
            font-size: 1rem;
        }

        /* Modal do Minijogo */
        #game-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            z-index: 1000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #game-canvas {
            background: #000;
            border: 2px solid #70a1ff;
            box-shadow: 0 0 20px rgba(112, 161, 255, 0.4);
            border-radius: 8px;
        }

        .game-title { color: #70a1ff; margin-bottom: 5px; text-transform: uppercase; }
        .game-instructions { color: #a4b0be; margin-bottom: 10px; text-align: center; max-width: 580px; }

        /* Tela Final */
        .end-screen { text-align: center; display: none; }
        .end-screen h1 { color: #2ed573; margin-bottom: 15px; }

        .student-summary {
            background: #1a1a24;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            text-align: left;
            border: 1px solid #3b3d54;
        }

        .alert-banner {
            background: #ff4757;
            color: #fff;
            padding: 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.2rem;
            margin-top: 25px;
            box-shadow: 0 4px 15px rgba(255,71,87,0.4);
            text-transform: uppercase;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container" id="quiz-container">
    
    <!-- TELA DE CADASTRO DO ALUNO -->
    <div class="registration-screen" id="reg-screen">
        <h2>Cadastro do Aluno</h2>
        <p style="color: #a4b0be; text-align: center; margin-bottom: 20px;">Preencha seus dados para iniciar a avaliação escolar.</p>
        
        <form id="student-form" onsubmit="submitRegistration(event)">
            <div class="form-group">
                <label>Nome Completo:</label>
                <input type="text" id="student-name" required placeholder="Ex: João Silva Santos">
            </div>

            <div class="form-group">
                <label>Turma / Ano:</label>
                <input type="text" id="student-class" required placeholder="Ex: 1º Ano B - Ensino Médio">
            </div>

            <div class="form-group">
                <label>Turno:</label>
                <select id="student-shift" required>
                    <option value="">Selecione o Turno</option>
                    <option value="Matutino">Matutino</option>
                    <option value="Vespertino">Vespertino</option>
                    <option value="Noturno">Noturno</option>
                    <option value="Integral">Integral</option>
                </select>
            </div>

            <div class="form-group">
                <label>Data:</label>
                <input type="date" id="student-date" required>
            </div>

            <button type="submit" class="start-btn">Iniciar Avaliação</button>
        </form>
    </div>

    <!-- CORPO DO QUIZ -->
    <div id="quiz-screen" style="display: none;">
        <div class="header">
            <div class="score-info">
                Questão <span id="current-q">1</span>/20 | Pontos: <span id="score">0</span>
            </div>
            <div class="hearts-container" id="hearts"></div>
        </div>

        <div id="quiz-body">
            <div class="question-category" id="q-category">Matéria</div>
            <div class="question-text" id="q-text">Carregando pergunta...</div>
            <div class="options-container" id="options-container"></div>
            <div class="feedback" id="feedback-box"></div>
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">Próxima Questão</button>
        </div>
    </div>

    <!-- TELA FINAL COM RESUMO E NOTA -->
    <div class="end-screen" id="end-screen">
        <h1>AVALIAÇÃO CONCLUÍDA!</h1>

        <div class="student-summary" id="summary-box">
            <!-- Dados do aluno serão inseridos aqui via JS -->
        </div>

        <p style="font-size: 1.3rem;">Sua Pontuação Final: <strong id="final-score">0</strong> de 20.0</p>
        <p style="font-size: 1.1rem; color: #a4b0be; margin-top: 5px;" id="final-percent"></p>
        
        <div class="alert-banner">
            PARABÉNS!<br>
            CIGARROS ELETRÔNICOS, PODs e MINI-VAPEs SÃO VICIANTES E PODEM CAUSAR DOENÇAS!
        </div>

        <button onclick="window.print()" class="next-btn" style="display:block; margin-top: 15px; background: #2ed573;">Imprimir / Salvar PDF</button>
        <button onclick="location.reload()" class="next-btn" style="display:block; margin-top: 10px;">Refazer Avaliação</button>
    </div>
</div>

<!-- Modal Unificado dos Minijogos -->
<div id="game-modal">
    <h2 class="game-title" id="minigame-title">MINIJOGO DE RECUPERAÇÃO</h2>
    <p class="game-instructions" id="minigame-desc"></p>
    <p class="game-instructions" id="minigame-controls"></p>
    <canvas id="game-canvas" width="600" height="400"></canvas>
</div>

<script>
// Dados do Aluno
let studentData = {};

// Preenche a data de hoje por padrão
document.getElementById('student-date').valueAsDate = new Date();

function submitRegistration(event) {
    event.preventDefault();
    
    studentData = {
        name: document.getElementById('student-name').value,
        className: document.getElementById('student-class').value,
        shift: document.getElementById('student-shift').value,
        date: document.getElementById('student-date').value
    };

    document.getElementById('reg-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'block';
    
    initQuiz();
}

// Banco de Questões (20 Perguntas)
const questions = [
    { category: "Biologia", question: "Qual das seguintes condições pulmonares graves está diretamente associada ao uso de vapes e PODs, causada pelo acúmulo de substâncias químicas nos alvéolos?", options: ["EVALI (Lesão Pulmonar Associada ao Uso de Produtos de Cigarro Eletrônico)", "Apendicite Aguda", "Insuficiência Renal Crônica", "Osteoporose Precoce"], correct: 0, explanation: "A EVALI é uma lesão pulmonar aguda e grave documentada clinicamente, diretamente ligada à inalação dos solventes e aditivos dos e-liquids." },
    { category: "Química", question: "Os e-liquids dos PODs usam sais de nicotina sintetizados com Ácido Benzóico. Qual o principal objetivo químico dessa alteração no pH do composto?", options: ["Aumentar o ponto de ebulição do óleo", "Suavizar o golpe na garganta, permitindo inalar doses muito mais altas de nicotina", "Mudar a cor do vapor para torná-lo invisível", "Neutralizar completamente os efeitos viciantes da nicotina"], correct: 1, explanation: "A adição de ácido reduz o pH da nicotina pura, tornando a fumaça menos irritante para a garganta e permitindo inalar concentrações altíssimas sem tossir." },
    { category: "Geografia & Meio Ambiente", question: "Como o descarte inadequado de PODs descartáveis afeta o meio ambiente e o ecossistema urbano?", options: ["Eles se biodegradam em menos de 24 horas no solo.", "Liberam metais pesados e plástico, além de conterem baterias de Íon-Lítio que contaminam solo e lençóis freáticos.", "Eles se transformam em adubo orgânico rico em nitrogênio.", "Não geram impacto, pois são feitos 100% de papel reciclado."], correct: 1, explanation: "Os PODs contêm plástico não biodegradável, baterias de lítio perigosas e resíduos químicos que contaminam a fauna e os recursos hídricos." },
    { category: "Física", question: "O aquecimento da resistência (coil) do vape transforma a mistura líquida em aerossol. Esse processo térmico de transição de fase é chamado de:", options: ["Sublimação", "Vaporização / Ebuliailização por aquecimento ôhmico", "Fusão Nuclear", "Solidificação"], correct: 1, explanation: "A corrente elétrica passa pela resistência (Efeito Joule), gerando calor que vaporiza o e-liquid rapidamente." },
    { category: "História", question: "Ao analisar a história da indústria do tabaco, qual estratégia das empresas do século XX se repete hoje no marketing dos vapes e PODs?", options: ["Vender apenas para idosos em farmácias", "Associar o produto à modernidade, sabores atrativos e estilo de vida jovem para criar novos dependentes", "Alertar o público ativamente sobre todos os riscos fatais de seus produtos", "Doar todos os lucros para pesquisas de saúde pública"], correct: 1, explanation: "A indústria utiliza estratégias históricas de marketing: design atraente, sabores doces e apelo de 'status' para atrair o público jovem." },
    { category: "Matemática", question: "Um POD descartável contém cerca de 50mg/ml de nicotina em um reservatório de 2ml. Sabendo que 1 maço de cigarro tradicional contém cerca de 20mg de nicotina absorvível, a quantidade de nicotina desse POD equivale a aproximadamente quantos maços?", options: ["Meio maço", "1 maço", "5 maços", "10 a 15 maços"], correct: 2, explanation: "50mg/ml * 2ml = 100mg de nicotina total no dispositivo. Dividido por ~20mg por maço tradicional = cerca de 5 maços de cigarro em quantidade total de substância." },
    { category: "Sociologia", question: "A pressão dos pares (peer pressure) e o desejo de pertencimento a grupos sociais na juventude atuam como fatores sociológicos para:", options: ["A diminuição drástica do consumo de drogas em festas", "A normalização e adesão ao uso de PODs, transformando o vício em um ritual de sociabilização", "A proibição voluntária de eletrônicos em ambientes escolares", "O aumento da conscientização ecológica entre adolescentes"], correct: 1, explanation: "A sociologia explica que o comportamento de grupo e o desejo de integração induzem jovens a adotarem hábitos nocivos por validação social." },
    { category: "Língua Portuguesa", question: "Na frase 'Embora os PODs pareçam inofensivos devido ao cheiro adocicado, eles contêm substâncias tóxicas', a oração sublinhada expressa ideia de:", options: ["Causa", "Concessão (oposição a uma ideia principal sem anulá-la)", "Consequência", "Tempo"], correct: 1, explanation: "A conjunção 'Embora' introduz uma oração subordinada adverbial concessiva." },
    { category: "Filosofia", question: "Sob a ótica da Ética e do Conceito de Autonomia em Filosofia, a dependência química gerada pela nicotina afeta a liberdade humana porque:", options: ["Fortalece o livre-arbítrio ao dar mais opções de escolha", "Submete a vontade do indivíduo ao desejo compulsivo da substância, reduzindo sua autonomia de decisão", "Não possui qualquer relação com o pensamento ético", "Garante a felicidade plena segundo o utilitarismo"], correct: 1, explanation: "A dependência escraviza o comportamento humano ao ciclo químico de abstinência e recompensa, tolhendo a verdadeira autonomia do indivíduo." },
    { category: "Biologia", question: "Qual o impacto do uso continuado de nicotina presente nos vapes sobre o sistema cardiovascular?", options: ["Reduz a frequência cardíaca e relaxa as artérias", "Causa vasoconstrição, aumenta a pressão arterial e eleva os riscos de infarto e AVC", "Regenera o músculo cardíaco", "Aumenta a oxigenação do sangue"], correct: 1, explanation: "A nicotina estimula a liberação de adrenalina, acelerando os batimentos cardíacos e estreitando os vasos sanguíneos (vasoconstrição)." },
    { category: "Química", question: "Substâncias como o Diacetil, frequentemente usadas para dar sabor amanteigado/doce aos e-liquids, estão associadas a qual doença quando inaladas?", options: ["Bronquiolite Obliterante (Pulmão de Pipoca)", "Cálculo Renal", "Gastrite Crônica", "Catarata"], correct: 0, explanation: "O Diacetil é seguro para ingestão alimentar, mas extremamente tóxico para o tecido pulmonar quando vaporizado e inalado, destruindo os bronquíolos." },
    { category: "Matemática", question: "Se um jovem gasta R$ 80,00 por semana em PODs descartáveis, quanto ele terá gasto ao final de 1 ano (52 semanas)?", options: ["R$ 800,00", "R$ 2.400,00", "R$ 4.160,00", "R$ 10.000,00"], correct: 2, explanation: "80 x 52 = R$ 4.160,00. Um impacto financeiro direto e significativo no orçamento pessoal." },
    { category: "Geografia", question: "A extração de Lítio para a fabricação das baterias que alimentam os PODs gera intensos impactos socioambientais em regiões como o 'Cinturão do Lítio' na América do Sul. Que impacto é esse?", options: ["Erosão do solo e consumo ostensivo de água em regiões de extrema seca", "Reflorestamento de florestas tropicais", "Purificação do ar atmosférico local", "Aumento da biodiversidade aquática"], correct: 0, explanation: "A mineração de lítio consome milhões de litros de água em áreas áridas (como o Atacama), prejudicando comunidades locais e ecossistemas." },
    { category: "História", question: "No Brasil, qual a posição oficial da ANVISA (Agência Nacional de Vigilância Sanitária) em relação aos Dispositivos Eletrônicos para Fumar (DEFs)?", options: ["A comercialização, importação e propaganda são proibidas desde 2009, decisão mantida e reforçada em reavaliações recentes.", "São vendidos livremente com incentivo do governo.", "São obrigatórios para maiores de 15 anos.", "São considerados medicamentos essenciais distribuídos pelo SUS."], correct: 0, explanation: "A RDC nº 46/2009 da ANVISA proíbe a comercialização, importação e publicidade de vapes e PODs no Brasil devido à ausência de dados científicos de segurança." },
    { category: "Física", question: "As baterias de Íon-Lítio dos vapes armazenam energia química que é convertida em energia elétrica. O mau uso ou superaquecimento dessa bateria pode levar a um fenômeno de explosão chamado:", options: ["Fissão Fria", "Fuga Térmica (Thermal Runaway)", "Condensação Estática", "Implosão Magnética"], correct: 1, explanation: "A Fuga Térmica ocorre quando um curto-circuito ou superaquecimento gera um ciclo incontrolável de aumento de temperatura, podendo explodir o dispositivo." },
    { category: "Língua Portuguesa", question: "Analise a ambiguidade da frase publicitária enganosa: 'Vape é vapor de água puro'. O erro conceitual e linguístico reside em:", options: ["Usar uma metáfora para esconder que o 'vapor' é na verdade um aerossol químico com micropartículas e substâncias nocivas.", "A palavra 'água' estar grafada incorretamente.", "A frase ser muito longa.", "Não conter verbos."], correct: 0, explanation: "A afirmação usa uma falsa equivalência. Vapes não produzem vapor de água pura, mas sim aerossóis de solventes, essências, metais pesados e nicotina." },
    { category: "Sociologia / Saúde Coletiva", question: "O conceito de 'Harm Reduction' (Redução de Danos) é muitas vezes distorcido no contexto dos vapes para:", options: ["Convencer não-fumantes e jovens de que o produto é inofensivo, criando uma nova onda de dependentes químicos", "Eliminar a poluição do ar nas cidades", "Proibir o acesso a qualquer tratamento médico", "Substituir a alimentação saudável"], correct: 0, explanation: "Enquanto a redução de danos visa ajudar adultos fumantes graves a migrarem de risco, o apelo comercial atrai jovens não-fumantes que nunca usariam cigarro comum." },
    { category: "Biologia", question: "O cérebro humano se desenvolve até aproximadamente os 25 anos. O uso de nicotina durante a adolescência afeta principalmente qual área cerebral e função?", options: ["O córtex pré-frontal, prejudicando o controle de impulsos, atenção e memória", "O cerebelo, eliminando completamente o equilíbrio motor", "O sistema auditivo, causando surdez imediata", "Não afeta o cérebro jovem"], correct: 0, explanation: "A nicotina altera a formação de conexões sinápticas no córtex pré-frontal jovem, aumentando a ansiedade, impulsividade e vulnerabilidade a outros vícios." },
    { category: "Filosofia / Ética", question: "Ao considerar a indústria de PODs descartáveis que geram toneladas de lixo eletrônico tóxico para um consumo passageiro, que princípio ético está sendo violado?", options: ["A Responsabilidade Intergeracional e o Cuidado com o Meio Ambiente Futuro", "A busca pelo prazer hedonista imediato a qualquer custo sem restrições", "O imperativo de produzir mais lixo plástico", "A negação da existência da natureza"], correct: 0, explanation: "A ética ambiental prega que nossas ações não devem comprometer os recursos e a saúde do planeta para as futuras gerações." },
    { category: "Educação Física & Saúde", question: "Como a capacidade aeróbica de um atleta jovem é afetada pelo uso constante de vapes/PODs?", options: ["Melhora a troca gasosa e o rendimento físico", "Reduz a eficiência da troca gasosa nos alvéolos, causa inflamação nas vias aéreas e diminui o fôlego e a resistência física", "Aumenta a quantidade de hemoglobina no sangue", "Não causa nenhum efeito no desempenho esportivo"], correct: 1, explanation: "A irritação e inflamação crônica nos tecidos pulmonares reduzem a eficiência da absorção de oxigênio, comprometendo o fôlego e o rendimento esportivo." }
];

// Estado do Jogo
let currentQIndex = 0;
let score = 0;
let hearts = 5;
let errorCount = 0;
let awaitingNext = false;
let gameCycleIndex = 0;

function initQuiz() {
    renderHearts();
    showQuestion();
}

function renderHearts() {
    const container = document.getElementById('hearts');
    container.innerHTML = '';
    
    let tempHearts = hearts;
    for (let i = 0; i < 5; i++) {
        if (tempHearts >= 1) {
            container.innerHTML += '&#2764; ';
            tempHearts -= 1;
        } else if (tempHearts === 0.5) {
            container.innerHTML += '&#128148; ';
            tempHearts -= 0.5;
        } else {
            container.innerHTML += '<span style="opacity: 0.2">&#2764;</span> ';
        }
    }
}

function showQuestion() {
    awaitingNext = false;
    const q = questions[currentQIndex];
    document.getElementById('current-q').innerText = currentQIndex + 1;
    document.getElementById('q-category').innerText = q.category;
    document.getElementById('q-text').innerText = q.question;
    
    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';
    
    const feedbackBox = document.getElementById('feedback-box');
    feedbackBox.style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';

    q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = `${String.fromCharCode(65 + idx)}) ${opt}`;
        btn.onclick = () => checkAnswer(idx);
        optionsContainer.appendChild(btn);
    });
}

function checkAnswer(selectedIdx) {
    if (awaitingNext) return;
    awaitingNext = true;

    const q = questions[currentQIndex];
    const feedbackBox = document.getElementById('feedback-box');
    const options = document.querySelectorAll('.option-btn');
    
    options.forEach(btn => btn.style.pointerEvents = 'none');

    if (selectedIdx === q.correct) {
        score += 1.0;
        options[selectedIdx].style.background = '#2ed573';
        options[selectedIdx].style.borderColor = '#2ed573';
        feedbackBox.className = 'feedback correct';
        feedbackBox.innerHTML = `<strong>Resposta Correta!</strong><br>${q.explanation}`;
        document.getElementById('next-btn').style.display = 'block';
    } else {
        hearts -= 0.5;
        errorCount++;
        renderHearts();
        
        options[selectedIdx].style.background = '#ff4757';
        options[q.correct].style.background = '#2ed573';

        feedbackBox.className = 'feedback incorrect';
        feedbackBox.innerHTML = `<strong>Incorreto (-0.5 Coração).</strong><br>${q.explanation}`;

        if (errorCount % 3 === 0) {
            setTimeout(() => {
                if (gameCycleIndex === 0) {
                    startAsteroidsGame();
                    gameCycleIndex = 1;
                } else if (gameCycleIndex === 1) {
                    startRacingGame();
                    gameCycleIndex = 2;
                } else {
                    startPitfallGame();
                    gameCycleIndex = 0;
                }
            }, 1500);
        } else {
            document.getElementById('next-btn').style.display = 'block';
        }
    }
    document.getElementById('score').innerText = score.toFixed(1);
    
    if (hearts <= 0) {
        hearts = 0;
        renderHearts();
    }
}

function nextQuestion() {
    currentQIndex++;
    if (currentQIndex < questions.length && hearts > 0) {
        showQuestion();
    } else {
        finishQuiz();
    }
}

function finishQuiz() {
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('end-screen').style.display = 'block';
    
    // Renderiza resumo do aluno
    document.getElementById('summary-box').innerHTML = `
        <p><strong>Aluno(a):</strong> ${studentData.name}</p>
        <p><strong>Turma:</strong> ${studentData.className} | <strong>Turno:</strong> ${studentData.shift}</p>
        <p><strong>Data da Realização:</strong> ${studentData.date}</p>
    `;

    document.getElementById('final-score').innerText = score.toFixed(1);
    const percent = ((score / 20) * 100).toFixed(0);
    document.getElementById('final-percent').innerText = `Aproveitamento: ${percent}%`;

    // Enviar dados automaticamente para o professor (Se você configurar Webhook)
    sendResultsToTeacher();
}

function sendResultsToTeacher() {
    const payload = {
        aluno: studentData.name,
        turma: studentData.className,
        turno: studentData.shift,
        data: studentData.date,
        nota: score.toFixed(1),
        errosTotal: errorCount
    };

    console.log("Dados do Aluno Prontos para Envio:", payload);

    /* PARA CONECTAR AO GOOGLE SHEETS / FORMS:
    fetch('SEU_WEBHOOK_URL_AQUI', {
        method: 'POST',
        body: JSON.stringify(payload)
    });
    */
}

/* ===================================================
   SISTEMA DOS MINIJOGOS (CANVAS)
   =================================================== */
const modal = document.getElementById('game-modal');
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');

let gameInterval, keys = {};

function cleanupMinigame() {
    clearInterval(gameInterval);
    document.removeEventListener('keydown', handleKeyDown);
    document.removeEventListener('keyup', handleKeyUp);
    keys = {};
}

function handleKeyDown(e) { keys[e.code] = true; }
function handleKeyUp(e) { keys[e.code] = false; }

function endMinigame(won) {
    cleanupMinigame();
    modal.style.display = 'none';

    if (won) {
        hearts = Math.min(5, hearts + 1.0);
        score += 0.5;
        document.getElementById('score').innerText = score.toFixed(1);
        renderHearts();
        alert("MINIJOGO CONCLUÍDO! Você recuperou 1 Coração e ganhou +0.5 ponto!");
    }
    
    document.getElementById('next-btn').style.display = 'block';
}

/* --- MINIJOGO 1: ASTEROIDS --- */
let ship, bullets, clouds, destroyedClouds;

function startAsteroidsGame() {
    cleanupMinigame();
    document.getElementById('minigame-title').innerText = "MINIJOGO 1: DESTRUINDO A FUMAÇA (ASTEROIDS)";
    document.getElementById('minigame-desc').innerText = "Você errou 3 vezes! Destrua 5 nuvens de fumaça de vape para recuperar a saúde!";
    document.getElementById('minigame-controls').innerHTML = "<strong>Controles:</strong> &larr; &rarr; para Girar | &uarr; para Acelerar | ESPAÇO para Atirar";
    
    modal.style.display = 'flex';
    destroyedClouds = 0;
    
    ship = { x: canvas.width / 2, y: canvas.height / 2, r: 15, angle: 90 / 180 * Math.PI, thrust: { x: 0, y: 0 } };
    bullets = []; clouds = [];

    for (let i = 0; i < 5; i++) {
        let x, y;
        do { x = Math.random() * canvas.width; y = Math.random() * canvas.height; } while (Math.hypot(ship.x - x, ship.y - y) < 100);
        clouds.push({ x: x, y: y, xv: (Math.random() - 0.5) * 2, yv: (Math.random() - 0.5) * 2, r: 25 });
    }

    document.addEventListener('keydown', handleKeyDown);
    document.addEventListener('keyup', handleKeyUp);
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && bullets.length < 5) {
            bullets.push({
                x: ship.x + 4/3 * ship.r * Math.cos(ship.angle),
                y: ship.y - 4/3 * ship.r * Math.sin(ship.angle),
                xv: 6 * Math.cos(ship.angle), yv: -6 * Math.sin(ship.angle)
            });
        }
    });

    gameInterval = setInterval(updateAsteroids, 1000 / 60);
}

function updateAsteroids() {
    if (keys['ArrowLeft']) ship.angle += 0.08;
    if (keys['ArrowRight']) ship.angle -= 0.08;
    if (keys['ArrowUp']) { ship.thrust.x += 0.1 * Math.cos(ship.angle); ship.thrust.y -= 0.1 * Math.sin(ship.angle); }

    ship.x = (ship.x + ship.thrust.x + canvas.width) % canvas.width;
    ship.y = (ship.y + ship.thrust.y + canvas.height) % canvas.height;

    ctx.fillStyle = '#0f0f15'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#70a1ff'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(ship.x + 4/3 * ship.r * Math.cos(ship.angle), ship.y - 4/3 * ship.r * Math.sin(ship.angle));
    ctx.lineTo(ship.x - ship.r * (2/3 * Math.cos(ship.angle) + Math.sin(ship.angle)), ship.y + ship.r * (2/3 * Math.sin(ship.angle) - Math.cos(ship.angle)));
    ctx.lineTo(ship.x - ship.r * (2/3 * Math.cos(ship.angle) - Math.sin(ship.angle)), ship.y + ship.r * (2/3 * Math.sin(ship.angle) + Math.cos(ship.angle)));
    ctx.closePath(); ctx.stroke();

    for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].x += bullets[i].xv; bullets[i].y += bullets[i].yv;
        ctx.fillStyle = '#ff4757'; ctx.beginPath(); ctx.arc(bullets[i].x, bullets[i].y, 3, 0, Math.PI * 2); ctx.fill();
        if (bullets[i].x < 0 || bullets[i].x > canvas.width || bullets[i].y < 0 || bullets[i].y > canvas.height) bullets.splice(i, 1);
    }

    ctx.fillStyle = 'rgba(220, 221, 225, 0.4)'; ctx.strokeStyle = '#fff';
    for (let i = clouds.length - 1; i >= 0; i--) {
        clouds[i].x = (clouds[i].x + clouds[i].xv + canvas.width) % canvas.width;
        clouds[i].y = (clouds[i].y + clouds[i].yv + canvas.height) % canvas.height;
        ctx.beginPath(); ctx.arc(clouds[i].x, clouds[i].y, clouds[i].r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

        for (let j = bullets.length - 1; j >= 0; j--) {
            if (Math.hypot(bullets[j].x - clouds[i].x, bullets[j].y - clouds[i].y) < clouds[i].r) {
                bullets.splice(j, 1); clouds.splice(i, 1); destroyedClouds++; break;
            }
        }
    }
    if (destroyedClouds >= 5) endMinigame(true);
}

/* --- MINIJOGO 2: CORRIDA --- */
let car, obstacles, passedObstacles, roadOffset;

function startRacingGame() {
    cleanupMinigame();
    document.getElementById('minigame-title').innerText = "MINIJOGO 2: CORRIDA DA SAÚDE (RETRO DRIVE)";
    document.getElementById('minigame-desc').innerText = "Você errou 3 vezes! Dirija na pista e se esquive de 5 nuvens tóxicas de vape!";
    document.getElementById('minigame-controls').innerHTML = "<strong>Controles:</strong> Use &larr; &rarr; ou A / D para Mover o Carro para os lados";
    
    modal.style.display = 'flex'; passedObstacles = 0; roadOffset = 0;
    car = { x: canvas.width / 2 - 15, y: canvas.height - 70, width: 30, height: 50, speed: 5 };
    obstacles = []; spawnRacingObstacle();

    document.addEventListener('keydown', handleKeyDown);
    document.addEventListener('keyup', handleKeyUp);
    gameInterval = setInterval(updateRacing, 1000 / 60);
}

function spawnRacingObstacle() {
    const laneWidth = 300, roadStart = (canvas.width - laneWidth) / 2;
    obstacles.push({ x: roadStart + Math.random() * (laneWidth - 40), y: -50, r: 20, speed: 3.5 });
}

function updateRacing() {
    if ((keys['ArrowLeft'] || keys['KeyA']) && car.x > 150) car.x -= car.speed;
    if ((keys['ArrowRight'] || keys['KeyD']) && car.x < 450 - car.width) car.x += car.speed;
    roadOffset = (roadOffset + 5) % 40;

    ctx.fillStyle = '#111'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#1e272e'; ctx.fillRect(0, 0, 150, canvas.height); ctx.fillRect(450, 0, 150, canvas.height);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.setLineDash([20, 20]); ctx.lineDashOffset = -roadOffset;
    ctx.beginPath(); ctx.moveTo(300, 0); ctx.lineTo(300, canvas.height); ctx.stroke(); ctx.setLineDash([]);

    ctx.fillStyle = '#2ed573'; ctx.fillRect(car.x, car.y, car.width, car.height);
    ctx.fillStyle = '#1e90ff'; ctx.fillRect(car.x + 4, car.y + 12, car.width - 8, 20);

    for (let i = obstacles.length - 1; i >= 0; i--) {
        obstacles[i].y += obstacles[i].speed;
        ctx.fillStyle = 'rgba(255, 71, 87, 0.7)'; ctx.beginPath(); ctx.arc(obstacles[i].x, obstacles[i].y, obstacles[i].r, 0, Math.PI * 2); ctx.fill();

        if (car.x < obstacles[i].x + obstacles[i].r && car.x + car.width > obstacles[i].x - obstacles[i].r && car.y < obstacles[i].y + obstacles[i].r && car.y + car.height > obstacles[i].y - obstacles[i].r) {
            obstacles.splice(i, 1); spawnRacingObstacle(); continue;
        }

        if (obstacles[i].y > canvas.height + 20) {
            obstacles.splice(i, 1); passedObstacles++;
            if (passedObstacles < 5) spawnRacingObstacle();
        }
    }
    ctx.fillStyle = '#fff'; ctx.font = '16px Segoe UI'; ctx.fillText(`Desvios com sucesso: ${passedObstacles}/5`, 160, 30);
    if (passedObstacles >= 5) endMinigame(true);
}

/* --- MINIJOGO 3: PITFALL TRAP --- */
let runner, pits, passedPits, pitSpeed;

function startPitfallGame() {
    cleanupMinigame();
    document.getElementById('minigame-title').innerText = "MINIJOGO 3: ESCAPE DA ARMADILHA (PITFALL STAGE)";
    document.getElementById('minigame-desc').innerText = "Você errou 3 vezes! Corra pela selva urbana e pule sobre 5 poços/fumaças tóxicas!";
    document.getElementById('minigame-controls').innerHTML = "<strong>Controles:</strong> Pressione [ESPAÇO] ou [SETA CIMA] para Pular!";
    
    modal.style.display = 'flex'; passedPits = 0; pitSpeed = 4;
    runner = { x: 80, y: 280, width: 25, height: 40, velocityY: 0, isJumping: false, groundY: 280 };
    pits = []; spawnPit();

    document.addEventListener('keydown', handleKeyDown);
    document.addEventListener('keyup', handleKeyUp);
    gameInterval = setInterval(updatePitfall, 1000 / 60);
}

function spawnPit() { pits.push({ x: canvas.width + 50, width: 45, height: 25 }); }

function updatePitfall() {
    if ((keys['Space'] || keys['ArrowUp']) && !runner.isJumping) { runner.velocityY = -12; runner.isJumping = true; }
    runner.velocityY += 0.6; runner.y += runner.velocityY;

    if (runner.y >= runner.groundY) { runner.y = runner.groundY; runner.velocityY = 0; runner.isJumping = false; }

    ctx.fillStyle = '#101712'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#2ed573'; ctx.fillRect(0, 320, canvas.width, 80);
    ctx.fillStyle = '#70a1ff'; ctx.fillRect(runner.x, runner.y, runner.width, runner.height);
    ctx.fillStyle = '#f1c40f'; ctx.fillRect(runner.x + 5, runner.y - 10, 15, 10);

    for (let i = pits.length - 1; i >= 0; i--) {
        pits[i].x -= pitSpeed;
        ctx.fillStyle = '#0f0f15'; ctx.fillRect(pits[i].x, 320, pits[i].width, 80);
        ctx.fillStyle = 'rgba(255, 71, 87, 0.6)'; ctx.beginPath(); ctx.arc(pits[i].x + pits[i].width/2, 310, 15, 0, Math.PI * 2); ctx.fill();

        if (runner.x + runner.width > pits[i].x && runner.x < pits[i].x + pits[i].width && runner.y + runner.height >= 315) {
            pits[i].x = canvas.width + 50; continue;
        }

        if (pits[i].x + pits[i].width < 0) {
            pits.splice(i, 1); passedPits++;
            if (passedPits < 5) spawnPit();
        }
    }
    ctx.fillStyle = '#fff'; ctx.font = '16px Segoe UI'; ctx.fillText(`Obstáculos pulados: ${passedPits}/5`, 20, 40);
    if (passedPits >= 5) endMinigame(true);
}
</script>
