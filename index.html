<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio PODs & Vapes</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #12151e; color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 15px; }
        .card { background: #1a1e2d; width: 100%; max-width: 500px; padding: 25px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); position: relative; }
        .header-stats { display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 20px; }
        .badge { background: #262b3d; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 0.9em; }
        .badge-red { background: #e63946; color: #fff; }
        .badge-yellow { background: #fca311; color: #000; }
        h1 { text-align: center; font-size: 1.5rem; margin-bottom: 12px; }
        p.desc { color: #a0aab8; text-align: center; font-size: 0.9rem; margin-bottom: 20px; line-height: 1.4; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; color: #d0d7de; }
        input, select { width: 100%; padding: 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #fff; font-size: 0.95rem; }
        input:focus, select:focus { outline: none; border-color: #2ea043; }
        .btn { width: 100%; padding: 14px; background: #2ea043; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .btn:hover { background: #3fb950; }
        .footer-link { text-align: center; margin-top: 20px; }
        .footer-link a { color: #8b949e; text-decoration: none; font-size: 0.85rem; }
    </style>
</head>
<body>

    <div class="card">
        <div class="header-stats">
            <span class="badge badge-red">❤️ 5</span>
            <span class="badge badge-yellow">⭐ 0 pts</span>
        </div>

        <h1>Desafio PODs & Vapes (20 Questões)</h1>
        <p class="desc">Aprenda sobre os perigos dos cigarros eletrônicos através de 14 disciplinas escolares, teste seu conhecimento e jogue os minijogos de 30 segundos!</p>

        <form id="quizForm">
            <div class="form-group">
                <label for="nome">Nome Completo do Aluno:</label>
                <input type="text" id="nome" placeholder="Digite seu nome completo" required>
            </div>

            <div class="form-group">
                <label for="turma">Turma / Ano:</label>
                <input type="text" id="turma" placeholder="Ex: 8º Ano A, 1º EM B" required>
            </div>

            <div class="form-group">
                <label for="turno">Turno:</label>
                <select id="turno" required>
                    <option value="" disabled selected>Selecione o turno...</option>
                    <option value="Manhã">Manhã</option>
                    <option value="Tarde">Tarde</option>
                    <option value="Noite">Noite</option>
                </select>
            </div>

            <button type="submit" class="btn">🧪 Iniciar Desafio (20 Perguntas)</button>
        </form>

        <div class="footer-link">
            <a href="#">🔒 Banco de Dados dos Jogadores</a>
        </div>
    </div>

</body>
</html>
